# Netlify configuration for Next.js deployment

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Services removed from the Square catalog; send old links to the closest
# remaining treatment rather than letting them 404.
[[redirects]]
  from = "/services/circadia-enzyme-peel-led"
  to = "/services/deep-facial-led-light"
  status = 301

[[redirects]]
  from = "/services/led-peel-skinscript"
  to = "/services/deep-facial-led-light"
  status = 301

[[redirects]]
  from = "/services/deep-facial-mask-vitamins"
  to = "/services/deep-facial-led-light"
  status = 301

[[redirects]]
  from = "/services/crystal-healing-facial"
  to = "/services/deep-facial"
  status = 301

[[redirects]]
  from = "/services/microdermabrasion-facial"
  to = "/services/micro-nano-exo-booster-dermalogica"
  status = 301

[[redirects]]
  from = "/services/micropeel-facial"
  to = "/services/micro-nano-exo-booster-dermalogica"
  status = 301

[[redirects]]
  from = "/services/peeling-facial"
  to = "/services/micro-nano-exo-booster-dermalogica"
  status = 301

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
